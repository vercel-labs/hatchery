[project]
name = "fabricator"
version = "0.1.0"
description = "GitHub bot that ports e2e tests from js sdks to python sdks."
requires-python = ">=3.12"
dependencies = [
    "ai[otel]",
    "braintrust[otel]",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic>=2.7",
    "vercel",
    "vercel-connect",
    "vercel-internal-core",
    "vercel-oidc[verify]",
    "vercel-sandbox",
]

[tool.uv.sources]
# vercel-connect is not on pypi yet; its git main also needs git main of the
# others (pypi releases lag), so all five pin to the same checkout
vercel = { git = "https://github.com/vercel/vercel-py.git", branch = "main", subdirectory = "src/vercel" }
vercel-connect = { git = "https://github.com/vercel/vercel-py.git", branch = "main", subdirectory = "src/vercel-connect" }
vercel-internal-core = { git = "https://github.com/vercel/vercel-py.git", branch = "main", subdirectory = "src/vercel-internal-core" }
vercel-oidc = { git = "https://github.com/vercel/vercel-py.git", branch = "main", subdirectory = "src/vercel-oidc" }
vercel-sandbox = { git = "https://github.com/vercel/vercel-py.git", branch = "main", subdirectory = "src/vercel-sandbox" }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "uvicorn>=0.30",
]

[tool.vercel]
entrypoint = "main:app"

[[tool.vercel.workflows]]
entrypoint = "agent.runtime:workflow"

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
