[project]
name = "hatchery"
version = "0.1.0"
description = "a software factory: an agent reachable from slack, github, and its own ui."
requires-python = ">=3.12"
dependencies = [
    "ai[otel,vercel]",
    "asyncpg>=0.31.0",
    "asyncssh>=2.21,<3",
    "braintrust[otel]>=0.35.0",
    "cryptography>=43",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
    "pydantic>=2.7",
    "vercel",
    "vercel-connect",
    "websockets>=15,<17",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "uvicorn>=0.30",
]

[tool.vercel]
entrypoint = "app.server:app"

[[tool.vercel.subscribers]]
entrypoint = "app.server:worker_event"

[[tool.vercel.workflows]]
entrypoint = "agent.durable:workflow"

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
