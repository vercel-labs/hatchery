[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[project]
name = "vercel-hatchery"
version = "0.1.0"
description = "a software factory: an agent reachable from slack, github, and its own ui."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = [
    "ai[otel,vercel]",
    "asyncpg>=0.31.0",
    "asyncssh>=2.21,<3",
    "braintrust[otel]>=0.35.0",
    "fastapi>=0.138",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
    "pydantic>=2.7",
    "vercel",
    "vercel-connect",
    "websockets>=15,<17",
    "croniter>=6,<7",
    "rotorcore[vercel]==0.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "uvicorn>=0.30",
]

[tool.vercel]
entrypoint = "hatchery.app.server:app"

[[tool.vercel.subscribers]]
entrypoint = "hatchery.app.server:worker_event"
topics = ["hatchery-worker-events-v1"]

[[tool.vercel.subscribers]]
entrypoint = "hatchery.agent.runtime"
topics = ["hatchery-dispatcher-v1", "hatchery-dispatcher-maintenance-v1"]

[tool.uv]
exclude-newer-package = { rotorcore = "2026-09-17T00:00:00Z" }

[tool.uv.build-backend]
module-name = "hatchery"
module-root = ""

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
